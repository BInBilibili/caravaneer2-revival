<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>复兴 · 猎犬实战测试</title><style>
*{box-sizing:border-box}body{margin:0;background:#101719;color:#dce3dc;font:14px/1.5 system-ui,sans-serif}main{max-width:1220px;margin:auto;padding:20px}h1{font-size:24px;margin:0}p{color:#a8b6ad;margin:6px 0 14px}a{color:#a9d29b}header,.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:14px}.controls{margin:12px 0}button,select{font:inherit;color:inherit;background:#28352f;border:1px solid #546b5a;border-radius:5px;padding:8px 12px}button{cursor:pointer}button:hover:enabled{background:#3e5144}button:disabled{opacity:.45;cursor:default}#start{background:#46663b}canvas{display:block;width:100%;aspect-ratio:880/495;background:#242b23;border:1px solid #546b5a;touch-action:none}.status{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.panel{background:#1b2522;padding:12px;border:1px solid #36483c;border-radius:6px}#actors,#history{white-space:pre-line;font-variant-numeric:tabular-nums}#history{max-height:140px;overflow:auto}#error{color:#ffaaaa;white-space:pre-wrap}#status{color:#c6e7a9}small{color:#a8b6ad}@media(max-width:700px){.status{grid-template-columns:1fr}}
</style></head><body><main><header><div><h1>复兴 / 猎犬实战测试</h1><small>临时单位 · 真正的回合制战斗 · 不读写存档</small></div><a href="/mods/revival/qa/authoring-preview.html" target="_blank" rel="noopener">打开动画编辑器 ↗</a></header>
<p>左键空地移动，左键敌人攻击；使用战斗右侧原有按钮结束回合。下方快捷操作同样调用实际战斗逻辑。敌人由原有 AI 驱动，猎犬扑咬使用徒手伤害规则。</p>
<div class="controls"><label>操控角色 <select id="appearance"><option value="bite">猎犬（扑咬）</option></select></label><label>毛色 <select id="coat"><option value="0">原始灰褐</option><option value="1">沙褐</option><option value="2">银灰</option><option value="3">浅白</option></select></label><button id="start" disabled>载入中…</button><label><input id="sound" type="checkbox">音效</label><span id="status" role="status">正在准备资源，不会进入正常世界或读取存档。</span></div>
<canvas id="stage" width="880" height="495" aria-label="真实战斗场景"></canvas>
<div class="controls" id="commands"><button data-step="0">东北移动 ↗</button><button data-step="1">东南移动 ↘</button><button data-step="2">西南移动 ↙</button><button data-step="3">西北移动 ↖</button><button id="attack">攻击最近敌人</button><button id="turn">结束回合 / 观察 AI</button><button id="center">视角回中</button></div>
<div class="controls"><label>受击对象 <select id="target"></select></label><button id="hit">测试受击（10 伤害）</button><button id="kill">测试致命伤 / 尸体</button><small>伤害按钮是测试工具；会真实扣血、流血及触发死亡，不能撤销，可重新开始。</small></div>
<div class="status"><section class="panel"><b>当前单位状态</b><div id="actors"></div></section><section class="panel"><b>最近动作记录</b><div id="history" role="log"></div></section></div><pre id="error" role="alert"></pre>
</main><script type="module" src="/@id/virtual:bundled-mod-qa/revival/hound-battle.ts"></script></body></html>
